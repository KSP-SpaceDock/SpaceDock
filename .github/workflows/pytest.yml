name: PyTest

on:
- push
- pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    name: PyTest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install Dependencies
      run: |
        pip install -r requirements-backend.txt
        pip install -r requirements-tests.txt
    - name: pytest
      run: |
        cp logging.ini.example logging.ini
        cp config.ini.example config.ini
        sed -i 's|connection-string=.*|connection-string=sqlite:///test.db|' config.ini
        python3 spacedock database initialize --force
        python3 spacedock database populate --test
        python3 -m pytest -v tests/
