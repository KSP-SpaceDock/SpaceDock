name: Mypy

on:
- push
- pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    name: Mypy
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install Dependencies
      run: |
        pip install mypy
        pip install -r requirements-tests.txt
    - name: mypy
      run: |
        mypy SpaceDock alembic/versions
